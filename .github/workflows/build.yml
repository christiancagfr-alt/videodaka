name: Build installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-requirements.lock
      - name: Dependency consistency
        run: python -m pip check
      - name: Unit and security regression tests
        run: python -m unittest discover -s tests -v
      - name: Desktop integration checks
        run: python -c "import runpy; runpy.run_path('tests/check_ui.py')"
      - name: Build and smoke-test native installer
        run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevotionFlow-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
